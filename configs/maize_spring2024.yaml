predictor_sets:
  A:
    include_treatment: true
    include_traits: false
    max_timing_dap: 0
  E30:
    include_treatment: false
    max_timing_dap: 45
  E60:
    include_treatment: false
    max_timing_dap: 60
  C30:
    include_treatment: true
    max_timing_dap: 45
  C60:
    include_treatment: true
    max_timing_dap: 60
scopes:
- name: all25
- name: excl_h1
  exclude:
    H:
    - h1
models:
  LR:
    type: linear
  Ridge:
    type: ridge
    params:
      alpha: 1.0
  SVR:
    type: svr
    params:
      C: 10
      epsilon: 0.1
      gamma: scale
  RF:
    type: random_forest
    scale: false
    params:
      n_estimators: 200
      max_features: sqrt
      random_state: 42
      n_jobs: 1
